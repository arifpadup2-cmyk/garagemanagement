services:
  - type: web
    name: tecido-garage-management
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false   # set in the Render dashboard. Use Neon's POOLED endpoint
                      # (host contains "-pooler") for many concurrent connections;
                      # verify pg_advisory_xact_lock behaviour under PgBouncer first.
      - key: ADMIN_PASSWORD
        sync: false   # set in the Render dashboard (admin login password)
      - key: SESSION_SECRET
        generateValue: true   # Render generates a strong random secret and keeps it stable across deploys
      - key: ADMIN_USER
        value: arifpadup
      - key: ADMIN_NAME
        value: ARIF
      - key: NODE_VERSION
        value: 22
